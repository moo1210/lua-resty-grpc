load_module /tmp/grpc-bench/openresty/nginx/modules/ngx_grpc_client_module_patched.so;

worker_processes 1;
error_log /tmp/grpc-bench/logs/new-patched-error.log error;
pid /tmp/grpc-bench/run/new_patched.pid;
worker_rlimit_nofile 65535;

events {
    worker_connections 8192;
}

http {
    access_log off;

    lua_package_path "/tmp/grpc-bench/lua/?.lua;/home/carterschuller/Projects/Personal/GitHub/lua-resty-grpc/new/lualib/?.lua;/tmp/grpc-bench/build/lua-protobuf-master/?.lua;;";
    lua_package_cpath "/tmp/grpc-bench/build/lua-protobuf-master/?.so;;";

    server {
        listen 127.0.0.1:8084;
        keepalive_timeout 300s;
        keepalive_requests 1000000;

        location /unary {
            content_by_lua_block { require("bench").handle_a() }
        }

        location /unary_b {
            content_by_lua_block { require("bench").handle_b() }
        }

        location /unary_c {
            content_by_lua_block { require("bench").handle_c() }
        }
    }
}
