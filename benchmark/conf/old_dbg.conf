worker_processes 1;
error_log /tmp/grpc-bench/logs/old-dbg-error.log error;
pid /tmp/grpc-bench/run/old_dbg.pid;
worker_rlimit_nofile 65535;

events {
    worker_connections 8192;
}

http {
    access_log off;

    lua_package_path "/tmp/grpc-bench/lua/?.lua;/home/carterschuller/Projects/Personal/GitHub/lua-resty-grpc/old/lib/?.lua;;";
    lua_package_cpath "/home/carterschuller/Projects/Personal/GitHub/lua-resty-grpc/old/target/release/?.so;;";

    server {
        listen 127.0.0.1:8083;
        keepalive_timeout 300s;
        keepalive_requests 1000000;

        location /persistent {
            content_by_lua_block { require("bench_debug").handle_persistent() }
        }

        location /two_calls {
            content_by_lua_block { require("bench_debug").handle_two_calls() }
        }
    }
}
