[package]
name = "lua-resty-grpc"
version = "0.1.0"
edition = "2024"

[lib]
name = "restygrpc"
crate-type = ["staticlib"]
path = "src/lib.rs"

[dependencies]
tonic = { version = "0.14.6", default-features = false }
bytes = "1.12.1"
http = "1.5.0"
tokio = { version = "1.53.1", default-features = false, features = [
  "sync",
  "io-util",
] }
tokio-stream = { version = "0.1.19", default-features = false }
tower = "0.5.3"
hyper = "1.11.1"
h2 = "0.4.19"
http-body-util = "0.1.5"
http-body = "1.1.0"
log = "0.4.34"

[profile.release]
opt-level = "s"
debug = false
debug-assertions = false
overflow-checks = false
lto = true
codegen-units = 1
panic = 'unwind'
incremental = false
rpath = false
